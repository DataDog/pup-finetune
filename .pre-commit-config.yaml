repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
      - id: check-headers
        name: check license headers
        entry: uv run python scripts/check_headers.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-3rdparty
        name: check LICENSE-3rdparty.csv
        entry: uv run python scripts/check_3rdparty.py
        language: system
        files: ^(pyproject\.toml|LICENSE-3rdparty\.csv|scripts/check_3rdparty\.py)$
        pass_filenames: false
