[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "pup-finetune"
dynamic = ["version"]
description = "Curate a dataset from your Datadog Agent Observability traces, fine-tune an open-weight model, and evaluate it against the base model."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-3rdparty.csv"]
authors = [{ name = "Datadog, Inc.", email = "package@datadoghq.com" }]
keywords = [
  "datadog",
  "agent-observability",
  "llm-observability",
  "fine-tuning",
  "lora",
  "sft",
  "llm",
  "pup",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28",
  "keyring>=25.6",
  "pydantic>=2.11",
  "rich>=14",
  "typer>=0.16",
]

[project.optional-dependencies]
# Hugging Face chat templates and tokenizers for the shared renderer (rendering/hf.py).
# The transformers floor is above CVE-2026-9856. Kimi K3's tokenizer code imports tiktoken.
hf = ["transformers>=5.10.4", "jinja2>=3.1", "huggingface-hub>=0.34", "tiktoken>=0.14"]
# Fireworks training: the Training SDK, the tinker types it trains with (which
# providers/fireworks/client.py builds directly; the SDK pins the exact version) and the
# shared renderer.
fireworks = [
  "fireworks-ai[training-sdk]>=1.2.19,<1.3",
  "tinker>=0.23,<0.38",
  "pup-finetune[hf]",
]
# Judges on Anthropic: the official SDK (anthropic_client.py is the only module that loads it).
anthropic = ["anthropic>=1,<3"]
# The Baseten Loops SDK, pinned to the version the client is tested with (providers/baseten).
baseten = ["pup-finetune[hf]", "baseten-loops==0.33.0"]

[project.scripts]
pup-finetune = "pup_finetune.cli:main"

[project.urls]
Repository = "https://github.com/DataDog/pup-finetune"

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "src/pup_finetune/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pup_finetune"]

# The agent skill's one source is skills/ at the repository root (where the skills CLI finds
# it); the wheel ships a copy that `pup finetune skill` reads with importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"skills/datadog-finetune/SKILL.md" = "pup_finetune/_skills/datadog-finetune/SKILL.md"

# An explicit allowlist, so untracked local files (scratch notes, files hidden only by
# .git/info/exclude) never end up in a published sdist. Paths that do not exist are skipped.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/bin",
  "/docs",
  "/skills",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/LICENSE-3rdparty.csv",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/pup_finetune/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; the license header line is 116 characters and must stay verbatim.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["baseten", "baseten.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import shared fakes as `tests.fakes`.
pythonpath = ["."]
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
  "live: hits real external services (skipped unless PUP_FINETUNE_LIVE=1)",
  "tokenizer: downloads real tokenizers (skipped unless PUP_FINETUNE_TOKENIZER_TESTS=1)",
  "any_next_command: emits results that break the next_command rule on purpose",
]
